<style>

*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg3);color:var(--txt);font:15px/1.4 "gg sans","Segoe UI",system-ui,sans-serif}
button,input{font:inherit;color:inherit}

#auth{height:100%;display:grid;place-items:center;background:radial-gradient(circle at 20% 20%,#5865f2 0,#2b2d31 55%)}
.card{background:var(--bg3);padding:32px;border-radius:8px;width:min(92vw,420px);box-shadow:0 8px 30px #0008}
.card h1{font-size:24px;text-align:center;margin-bottom:6px}.card p{color:var(--mut);text-align:center;margin-bottom:20px}
.card label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:12px 0 6px}
input.in{width:100%;padding:10px;background:var(--bg1);border:0;border-radius:4px}
.btn{background:var(--acc);border:0;border-radius:4px;padding:10px 16px;cursor:pointer;font-weight:600;color:#fff}
.btn:hover{background:var(--acc2)}.btn.full{width:100%;margin-top:20px}.btn.red{background:var(--red)}
.link{background:none;border:0;color:#00a8fc;cursor:pointer;padding:0}
.err{color:#fa777c;font-size:13px;margin-top:10px;min-height:18px}
#app{display:none;height:100%;grid-template-columns:72px 240px 1fr auto}
#rail{background:var(--bg1);padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:8px;overflow:auto}

.sep{width:32px;height:2px;background:var(--bg3);border-radius:1px}

.hd{height:48px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;font-weight:700;border-bottom:1px solid #0003;flex:none}

.ch:hover{background:var(--hover);color:var(--txt)}.ch.on{background:#404249;color:#fff}
.sec{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;font-weight:700;padding:12px 8px 4px}
.sec button{background:none;border:0;color:var(--mut);cursor:pointer;font-size:18px;line-height:1}.sec button:hover{color:#fff}
#me{background:#232428;padding:8px;display:flex;align-items:center;gap:8px;flex:none}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
#me .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ib{background:none;border:0;color:var(--mut);cursor:pointer;padding:6px;border-radius:4px}.ib:hover{background:var(--hover);color:#fff}
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#msgs{flex:1;overflow:auto;padding:16px 0}
.m{display:flex;gap:16px;padding:2px 16px;position:relative}.m:hover{background:#2e3035}
.m.first{margin-top:16px}.m .gap{width:40px;flex:none;font-size:10px;color:transparent;text-align:center;padding-top:5px}.m:hover .gap{color:var(--mut)}
.m .av{width:40px;height:40px}.m .b{min-width:0}.m .t{white-space:pre-wrap;overflow-wrap:anywhere}
.m .who{font-weight:600;margin-right:8px}.m .ts{font-size:12px;color:var(--mut)}
.m .del{position:absolute;right:16px;top:-10px;display:none;background:var(--bg2);border:1px solid #0004}
.m:hover .del{display:block}
.empty{color:var(--mut);text-align:center;margin-top:40px;padding:0 20px}
#form{margin:0 16px 24px;flex:none;display:flex;align-items:center;background:#383a40;border-radius:8px;padding:0 6px}
#inp{flex:1;min-width:0;background:none;border:0;padding:12px 8px}#inp:focus-visible{outline:0}#form .ib{font-size:18px}
.pic{display:block;max-width:min(320px,100%);max-height:300px;border-radius:8px;margin-top:4px;cursor:zoom-in}
#emp{position:fixed;bottom:84px;right:16px;background:var(--bg2);border-radius:8px;padding:8px;display:none;grid-template-columns:repeat(8,1fr);gap:2px;box-shadow:0 4px 20px #0008;z-index:8;max-width:calc(100vw - 32px)}#emp.show{display:grid}#emp button{background:none;border:0;font-size:22px;cursor:pointer;border-radius:4px;padding:2px}#emp button:hover{background:var(--hover)}
#mem{width:240px;background:var(--bg2);padding:16px 8px;overflow:auto}
#mem h4{color:var(--mut);font-size:12px;padding:0 8px 8px}
.mb{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:4px}.mb:hover{background:var(--hover)}
.mb .av{width:32px;height:32px;font-size:13px}
.dlg{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:9}
.dlg.show{display:grid}
.dlg .card{box-shadow:none}.row{display:flex;gap:8px;margin-top:20px;justify-content:flex-end}
.row .btn.g{background:none}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111214;padding:10px 18px;border-radius:6px;display:none;z-index:99}
.av.img{background-size:cover;background-position:center;color:transparent}.m .av,.mb .av{cursor:pointer}
.rl{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;margin:3px 4px 0 0;border:1px solid;cursor:pointer}
audio{display:block;margin-top:4px;max-width:100%;height:40px}#mic.rec{color:var(--red);animation:pl 1s infinite}@keyframes pl{50%{opacity:.4}}
select.in{margin-top:8px}.who{cursor:pointer}
.acts{position:absolute;right:12px;top:-16px;display:none;background:var(--bg2);border:1px solid #0004;border-radius:6px;padding:2px;z-index:2}.m:hover .acts,.m.sel .acts{display:flex}.acts button{background:none;border:0;cursor:pointer;padding:4px 6px;font-size:16px;border-radius:4px}.acts button:hover{background:var(--hover)}
#ty{height:18px;margin:0 16px 2px;font-size:12px;color:var(--mut);flex:none;overflow:hidden;white-space:nowrap}
#callui{position:fixed;inset:0;background:#111214;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center}#callui.show{display:flex}
#rv{width:100%;max-height:68%;object-fit:contain;background:#000}#rv.audio{height:1px;opacity:0}
#lv{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top,0px));width:96px;border-radius:8px;background:#000;display:none}
#cs{margin:18px;font-size:18px;text-align:center}#cbar{display:flex;gap:18px}#cbar button{width:58px;height:58px;border-radius:50%;border:0;font-size:24px;cursor:pointer;background:#383a40}#cend{background:var(--red)!important}
.qt{font-size:12px;color:var(--mut);border-left:3px solid var(--acc);padding-left:8px;margin:2px 0}
.rx{background:#2b2d31;border:1px solid transparent;border-radius:8px;padding:1px 8px;margin:4px 4px 0 0;cursor:pointer}.rx.me{border-color:var(--acc);background:#3c4270}
#rb{display:none;margin:0 16px;padding:6px 12px;background:#2b2d31;border-radius:8px 8px 0 0;color:var(--mut);font-size:13px;align-items:center}
.sv.unr::after{content:"";position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:var(--red);border:3px solid var(--bg1)}
.ch.unr{color:#fff;font-weight:700}.ch.unr::after{content:"●";margin-left:auto;font-size:9px}
@media(max-width:900px){#mem{display:none}#app{grid-template-columns:72px 240px 1fr}}
.burger,#bd{display:none}
@media(max-width:700px){
html,body{height:100dvh}#app{height:100dvh;grid-template-columns:1fr}
#rail,#side{position:fixed;top:0;bottom:0;z-index:20;transform:translateX(calc(-100% - 80px));transition:transform .2s}
#rail{left:0;width:72px}#side{left:72px;width:min(240px,calc(100vw - 72px))}
#app.nav #rail,#app.nav #side{transform:none}
#app.nav #bd{display:block;position:fixed;inset:0;background:#0008;z-index:10}
.burger{display:inline-block;margin-right:8px;font-size:20px}
#inp,input.in{font-size:16px}.m .del{display:block;top:0;opacity:.7}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.t code{background:var(--bg1);padding:1px 5px;border-radius:4px;font:13px/1.4 ui-monospace,Consolas,monospace}
.t pre{background:var(--bg1);border:1px solid var(--bg2);border-radius:6px;padding:8px 10px;margin:4px 0;overflow-x:auto;white-space:pre;font:13px/1.4 ui-monospace,Consolas,monospace}
.t pre code{padding:0;background:none}.t a{color:#00a8fc;text-decoration:none}.t a:hover{text-decoration:underline}
.mn{background:rgba(88,101,242,.3);color:#c9cdfb;border-radius:3px;padding:0 2px;cursor:pointer;font-weight:500}
.m.ment{background:rgba(250,166,26,.1);box-shadow:inset 3px 0 #faa61a}
[data-theme=light]{--bg1:#e3e5e8;--bg2:#f2f3f5;--bg3:#fff;--hover:#e8e9eb;--txt:#2e3338;--mut:#5c5e66}
[data-theme=light] #me{background:#ebedef}
[data-theme=neon]{--bg1:#090b18;--bg2:#10152a;--bg3:#0b1020;--hover:#1c2340;--txt:#e9f4ff;--mut:#93a4c7;--acc:#a855f7;--acc2:#7e22ce;--red:#fb476b;--grn:#2de2a6}
[data-theme=neon] #auth{background:radial-gradient(ellipse at 15% 15%,#7c3aed 0,transparent 42%),radial-gradient(ellipse at 85% 85%,#0e7490 0,transparent 45%),#080b18}
[data-theme=neon] .card,[data-theme=neon] #form,[data-theme=neon] .dlg .card{border:1px solid #8b5cf655;box-shadow:0 0 28px #7c3aed22}
[data-theme=neon] .sv.on,[data-theme=neon] .btn{box-shadow:0 0 14px #a855f744}
[data-theme=neon] .av{animation:fxglow 3s ease-in-out infinite alternate}
@keyframes fxglow{from{box-shadow:0 0 4px #a855f766}to{box-shadow:0 0 13px #22d3ee88}}
.ch.voicech{color:var(--mut)}
.ch.voicech::first-letter{color:#2de2a6}
[data-theme=neon] .ch.on{background:#a855f72a;box-shadow:inset 3px 0 #c084fc}
[data-theme=neon] .m.ment{background:#a855f71c;box-shadow:inset 3px 0 #c084fc}
[data-theme=neon] :focus-visible{outline-color:#67e8f9}
#acp{position:fixed;z-index:50;background:var(--bg2);border:1px solid var(--bg1);border-radius:8px;box-shadow:0 4px 16px #0006;max-height:220px;overflow:auto;display:none;min-width:180px}
#acp button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 12px;cursor:pointer}
#acp button.on,#acp button:hover{background:var(--hover)}
.qt{cursor:pointer}.m.flash{background:rgba(88,101,242,.25)}
.pl button{display:block;width:100%;max-width:360px;text-align:left;margin-top:4px;position:relative;background:var(--bg1);border:0;border-radius:4px;padding:6px 10px;cursor:pointer;overflow:hidden}
.pl .f{position:absolute;inset:0 auto 0 0;background:rgba(88,101,242,.35)}.pl span{position:relative}.pl .me{outline:1px solid var(--acc)}
#gv{position:fixed;right:12px;bottom:84px;background:var(--bg2);border:1px solid var(--bg1);border-radius:10px;padding:10px 12px;z-index:40;min-width:210px;display:none;box-shadow:0 4px 16px #0006}
#gv b{display:block;margin-bottom:6px}#gv .pp{font-size:14px;padding:5px 6px;margin:2px 0;border-radius:6px}#gv .ib{margin-right:4px}#gv{max-width:min(340px,calc(100vw - 24px));max-height:70vh;overflow:auto}#gv .vcontrols{display:flex;flex-wrap:wrap;gap:3px;border-bottom:1px solid var(--bg1);padding-bottom:6px;margin-bottom:6px}#gv .vdevices{display:grid;gap:5px;margin:6px 0}.vsetting{display:grid;gap:3px;font-size:11px;color:var(--mut)}.vsetting select{font-size:12px;padding:5px;max-width:100%}.vvol{margin:2px 0 0 18px}.vvol small{color:var(--mut)}#gv .speaking{outline:2px solid var(--grn);background:rgba(35,165,90,.14)}
.sysm{text-align:center;color:var(--mut);font-size:13px;margin:8px 0;padding:0 12px}

[data-theme=neon] .rl{box-shadow:0 0 10px #a855f733}

/* ---------- Discord-like profile cards ---------- */
#pnl:has(.profile-shell) #pc{width:min(94vw,720px);padding:0;overflow:hidden;background:#232428;border-radius:16px;border:1px solid #ffffff12;box-shadow:0 24px 80px #0009}
.profile-shell{--pcard:#232428;--psurface:#2b2d31;--ptext:#f2f3f5;--pmuted:#b5bac1;color:var(--ptext);background:var(--pcard);margin:0;padding:0 0 18px;overflow:hidden}
#pnl:has(.profile-shell) .row{padding:0 20px;margin-top:16px}
.profile-banner{height:190px;position:relative;background:linear-gradient(125deg,#5865f2,#9b59b6 55%,#00a8fc);background-size:cover;background-position:center;overflow:hidden}
.profile-banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,#232428aa)}
.profile-top{display:flex;align-items:flex-end;gap:16px;padding:0 24px;position:relative;margin-top:-48px;z-index:1}
.profile-avatar{width:112px;height:112px;border-radius:30px;border:7px solid var(--pcard);box-shadow:0 8px 22px #0005;display:grid;place-items:center;font-size:38px;overflow:hidden}
.profile-identity{min-width:0;flex:1;padding:0 0 9px}
.profile-name{font-size:25px;font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.profile-sub{font-size:13px;color:var(--pmuted);margin-top:5px;overflow-wrap:anywhere}
.profile-online{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#b9f5d0;background:#23a55a22;border:1px solid #23a55a55;border-radius:99px;padding:5px 9px;margin-top:8px}
.profile-online::before{content:"";width:7px;height:7px;background:#23a55a;border-radius:50%}
.profile-body{padding:18px 24px 0}
.profile-divider{height:1px;background:#ffffff12;margin:18px 0}
.profile-section-title{font-size:11px;letter-spacing:.09em;font-weight:800;color:#b5bac1;margin-bottom:10px}
.profile-bio{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.6;color:#dbdee1}
.profile-status{display:flex;align-items:center;gap:9px;background:#2b2d31;border:1px solid #ffffff0a;padding:10px 12px;border-radius:10px;margin-top:12px;font-size:13px;overflow-wrap:anywhere}
.profile-badges{display:flex;gap:8px;flex-wrap:wrap}
.profile-badge{display:flex;align-items:center;gap:7px;padding:8px 10px;border:1px solid #ffffff13;background:linear-gradient(135deg,#2b2d31,#30323a);border-radius:10px;font-size:12px;font-weight:650;color:#e3e5e8}
.profile-badge .emoji{font-size:18px}
.profile-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.profile-actions .btn{margin:0!important}
.profile-id{font-size:11px;color:#8e929b;word-break:break-all;margin-top:16px}
@media(max-width:520px){
 #pnl:has(.profile-shell) #pc{width:calc(100vw - 20px);max-height:90dvh;overflow:auto}
 .profile-shell{margin:0;padding-bottom:12px}
 .profile-banner{height:145px}
 .profile-top{padding:0 16px;gap:11px;margin-top:-40px}
 .profile-avatar{width:88px;height:88px;border-radius:24px;border-width:6px;font-size:30px}
 .profile-name{font-size:20px}
 .profile-body{padding:14px 16px 0}
 #pnl:has(.profile-shell) .row{padding:0 16px}
}



/* ---------- Fa1roxx community refresh: Discord-inspired polish ---------- */
:root{--bg1:#1e1f22;--bg2:#2b2d31;--bg3:#313338;--hover:#383a40;--txt:#dbdee1;--mut:#949ba4;--acc:#5865f2;--acc2:#4752c4;--red:#da373c;--grn:#23a55a;--line:#202225}
html{scrollbar-color:#1a1b1e #2b2d31;scrollbar-width:thin}
body{letter-spacing:.005em;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{transition:background-color .14s ease,color .14s ease,border-color .14s ease,transform .14s ease}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{accent-color:var(--acc)}
#auth{padding:24px;background:radial-gradient(ellipse at 15% 12%,#5865f255 0,transparent 38%),radial-gradient(ellipse at 88% 88%,#5865f222 0,transparent 38%),#1e1f22}
#auth .card{border:1px solid #ffffff0d;border-radius:12px;box-shadow:0 24px 80px #0006;max-width:440px;padding:34px}
#auth .card h1{font-size:26px;letter-spacing:-.035em}
#auth .card label{letter-spacing:.035em}
input.in,select.in{border:1px solid transparent;transition:border-color .15s,background .15s}
input.in:focus,select.in:focus{outline:0;border-color:var(--acc);background:var(--bg1)}
.btn{border-radius:5px;transition:background .15s,transform .15s,box-shadow .15s}
.btn:not(.g):hover{box-shadow:0 4px 14px #0002;filter:brightness(1.06)}
.btn.g{background:transparent;color:var(--txt);border:1px solid #ffffff1a}
.btn.g:hover{background:var(--hover)}
#app{min-width:0;min-height:0;background:var(--bg3)}
#rail{padding:12px 0 max(12px,env(safe-area-inset-bottom));gap:8px;box-shadow:inset -1px 0 #0002}
.sv{box-shadow:0 1px 0 #0001;font-size:17px;overflow:hidden}
.sv:hover{border-radius:16px;transform:translateY(-1px)}
.sv.on{border-radius:16px}
.sv.on::before{left:-12px}
.sv.add{font-size:24px;font-weight:400}
#side{box-shadow:inset -1px 0 #0002;min-height:0}
#side>.hd{height:49px;padding:0 16px;box-shadow:0 1px 0 #0002;white-space:nowrap;overflow:hidden}
#side>.hd span{overflow:hidden;text-overflow:ellipsis}
.side-search-wrap{height:38px;margin:12px 10px 4px;padding:0 9px;display:flex;align-items:center;gap:7px;border-radius:5px;background:#1e1f22;color:var(--mut);border:1px solid #ffffff08}
.side-search-wrap>span{font-size:20px;line-height:1}
.side-search-wrap input{width:100%;min-width:0;background:transparent;border:0;outline:0;color:var(--txt);font-size:12px;padding:7px 0}
.side-search-wrap input::placeholder{color:#8e929b}
.side-search-wrap kbd{font:inherit;font-size:10px;line-height:1.5;color:#777d86;border:1px solid #ffffff16;border-radius:3px;padding:1px 4px;white-space:nowrap}
#chs{padding:7px 8px 12px;scrollbar-width:thin;overscroll-behavior:contain}
.sec{align-items:center;gap:6px;letter-spacing:.035em;padding:12px 8px 5px}
.sec button{width:22px;height:22px;border-radius:4px;font-size:20px}
.ch{min-height:34px;align-items:center;line-height:1.25;padding:7px 9px;margin:1px 0;border-radius:5px;transition:background .12s,color .12s}
.ch:hover{background:#35373c}
.ch.on{background:#404249;color:#fff;box-shadow:inset 3px 0 var(--acc);padding-left:9px}
.ch.unr{color:#fff}
.ch[hidden],.sec[hidden]{display:none!important}
.side-no-results{margin:18px 8px;font-size:13px}
#me{min-height:64px;padding:9px 8px max(9px,env(safe-area-inset-bottom));gap:8px;border-top:1px solid #0002;background:#232428}
#me .av{width:34px;height:34px}
#me .nm{font-size:13px}
#me .ib{width:30px;height:30px;display:grid;place-items:center}
#main{background:var(--bg3);position:relative}
#main>.hd{height:49px;min-height:49px;padding:0 16px;gap:6px;border-bottom:1px solid #202225;box-shadow:0 1px 0 #ffffff03;z-index:1}
#cname{font-size:15px;font-weight:700;letter-spacing:.005em}
#main>.hd .ib{width:32px;height:32px;display:grid;place-items:center;border-radius:5px;font-size:17px}
#main>.hd .ib:hover{background:var(--hover)}
#msgs{padding:14px 0 20px;overscroll-behavior:contain;scrollbar-width:thin}
.m{gap:14px;padding:3px 16px;border-radius:0;transition:background .1s}
.m.first{margin-top:17px;padding-top:5px}
.m .av{width:40px;height:40px;border-radius:50%;box-shadow:0 1px 2px #0003}
.m .who{font-weight:650;letter-spacing:-.01em}
.m .ts{font-size:11px;color:#949ba4}
.m .b{line-height:1.48}
.m .t{line-height:1.5;word-break:break-word}
.m .gap{width:40px}
.m:hover{background:#2e3035}
.m.ment{background:#3b2f20}
.m.ment:hover{background:#443624}
.acts{top:-14px;border-radius:7px;box-shadow:0 4px 14px #0005;padding:3px;backdrop-filter:blur(8px)}

function rich(text, names) {
