<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discord Clone</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1e1f22"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg1:#1e1f22;--bg2:#2b2d31;--bg3:#313338;--hover:#35373c;--txt:#dbdee1;--mut:#949ba4;--acc:#5865f2;--acc2:#4752c4;--red:#da373c;--grn:#23a55a}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg3);color:var(--txt);font:15px/1.4 "gg sans","Segoe UI",system-ui,sans-serif}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid #00a8fc;outline-offset:2px}
#auth{height:100%;display:grid;place-items:center;background:radial-gradient(circle at 20% 20%,#5865f2 0,#2b2d31 55%)}
.card{background:var(--bg3);padding:32px;border-radius:8px;width:min(92vw,420px);box-shadow:0 8px 30px #0008}
.card h1{font-size:24px;text-align:center;margin-bottom:6px}.card p{color:var(--mut);text-align:center;margin-bottom:20px}
.card label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:12px 0 6px}
input.in{width:100%;padding:10px;background:var(--bg1);border:0;border-radius:4px}
.btn{background:var(--acc);border:0;border-radius:4px;padding:10px 16px;cursor:pointer;font-weight:600;color:#fff}
.btn:hover{background:var(--acc2)}.btn.full{width:100%;margin-top:20px}.btn.red{background:var(--red)}
.link{background:none;border:0;color:#00a8fc;cursor:pointer;padding:0}
.err{color:#fa777c;font-size:13px;margin-top:10px;min-height:18px}
#app{display:none;height:100%;grid-template-columns:72px 240px 1fr auto}
#rail{background:var(--bg1);padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:8px;overflow:auto}
.sv{width:48px;height:48px;border-radius:50%;background:var(--bg3);border:0;cursor:pointer;font-weight:700;color:var(--txt);transition:border-radius .15s,background .15s;position:relative;flex:none}
.sv:hover,.sv.on{border-radius:16px;background:var(--acc);color:#fff}
.sv.on::before{content:"";position:absolute;left:-12px;top:12px;width:4px;height:24px;background:#fff;border-radius:0 4px 4px 0}
.sv.add{color:var(--grn)}.sv.add:hover{background:var(--grn);color:#fff}
.sep{width:32px;height:2px;background:var(--bg3);border-radius:1px}
#side{background:var(--bg2);display:flex;flex-direction:column;min-width:0}
.hd{height:48px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;font-weight:700;border-bottom:1px solid #0003;flex:none}
#chs{flex:1;overflow:auto;padding:8px}
.ch{display:flex;width:100%;gap:6px;padding:6px 8px;border:0;background:none;border-radius:4px;color:var(--mut);cursor:pointer;text-align:left;font-weight:500}
.ch:hover{background:var(--hover);color:var(--txt)}.ch.on{background:#404249;color:#fff}
.sec{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;font-weight:700;padding:12px 8px 4px}
.sec button{background:none;border:0;color:var(--mut);cursor:pointer;font-size:18px;line-height:1}.sec button:hover{color:#fff}
#me{background:#232428;padding:8px;display:flex;align-items:center;gap:8px;flex:none}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
#me .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ib{background:none;border:0;color:var(--mut);cursor:pointer;padding:6px;border-radius:4px}.ib:hover{background:var(--hover);color:#fff}
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#msgs{flex:1;overflow:auto;padding:16px 0}
.m{display:flex;gap:16px;padding:2px 16px;position:relative}.m:hover{background:#2e3035}
.m.first{margin-top:16px}.m .gap{width:40px;flex:none;font-size:10px;color:transparent;text-align:center;padding-top:5px}.m:hover .gap{color:var(--mut)}
.m .av{width:40px;height:40px}.m .b{min-width:0}.m .t{white-space:pre-wrap;overflow-wrap:anywhere}
.m .who{font-weight:600;margin-right:8px}.m .ts{font-size:12px;color:var(--mut)}
.m .del{position:absolute;right:16px;top:-10px;display:none;background:var(--bg2);border:1px solid #0004}
.m:hover .del{display:block}
.empty{color:var(--mut);text-align:center;margin-top:40px;padding:0 20px}
#form{margin:0 16px 24px;flex:none;display:flex;align-items:center;background:#383a40;border-radius:8px;padding:0 6px}
#inp{flex:1;min-width:0;background:none;border:0;padding:12px 8px}#inp:focus-visible{outline:0}#form .ib{font-size:18px}
.pic{display:block;max-width:min(320px,100%);max-height:300px;border-radius:8px;margin-top:4px;cursor:zoom-in}
#emp{position:fixed;bottom:84px;right:16px;background:var(--bg2);border-radius:8px;padding:8px;display:none;grid-template-columns:repeat(8,1fr);gap:2px;box-shadow:0 4px 20px #0008;z-index:8;max-width:calc(100vw - 32px)}#emp.show{display:grid}#emp button{background:none;border:0;font-size:22px;cursor:pointer;border-radius:4px;padding:2px}#emp button:hover{background:var(--hover)}
#mem{width:240px;background:var(--bg2);padding:16px 8px;overflow:auto}
#mem h4{color:var(--mut);font-size:12px;padding:0 8px 8px}
.mb{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:4px}.mb:hover{background:var(--hover)}
.mb .av{width:32px;height:32px;font-size:13px}
.dlg{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:9}
.dlg.show{display:grid}
.dlg .card{box-shadow:none}.row{display:flex;gap:8px;margin-top:20px;justify-content:flex-end}
.row .btn.g{background:none}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111214;padding:10px 18px;border-radius:6px;display:none;z-index:99}
.av.img{background-size:cover;background-position:center;color:transparent}.m .av,.mb .av{cursor:pointer}
.rl{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;margin:3px 4px 0 0;border:1px solid;cursor:pointer}
audio{display:block;margin-top:4px;max-width:100%;height:40px}#mic.rec{color:var(--red);animation:pl 1s infinite}@keyframes pl{50%{opacity:.4}}
select.in{margin-top:8px}.who{cursor:pointer}
.acts{position:absolute;right:12px;top:-16px;display:none;background:var(--bg2);border:1px solid #0004;border-radius:6px;padding:2px;z-index:2}.m:hover .acts,.m.sel .acts{display:flex}.acts button{background:none;border:0;cursor:pointer;padding:4px 6px;font-size:16px;border-radius:4px}.acts button:hover{background:var(--hover)}
#ty{height:18px;margin:0 16px 2px;font-size:12px;color:var(--mut);flex:none;overflow:hidden;white-space:nowrap}
#callui{position:fixed;inset:0;background:#111214;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center}#callui.show{display:flex}
#rv{width:100%;max-height:68%;object-fit:contain;background:#000}#rv.audio{height:1px;opacity:0}
#lv{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top,0px));width:96px;border-radius:8px;background:#000;display:none}
#cs{margin:18px;font-size:18px;text-align:center}#cbar{display:flex;gap:18px}#cbar button{width:58px;height:58px;border-radius:50%;border:0;font-size:24px;cursor:pointer;background:#383a40}#cend{background:var(--red)!important}
.qt{font-size:12px;color:var(--mut);border-left:3px solid var(--acc);padding-left:8px;margin:2px 0}
.rx{background:#2b2d31;border:1px solid transparent;border-radius:8px;padding:1px 8px;margin:4px 4px 0 0;cursor:pointer}.rx.me{border-color:var(--acc);background:#3c4270}
#rb{display:none;margin:0 16px;padding:6px 12px;background:#2b2d31;border-radius:8px 8px 0 0;color:var(--mut);font-size:13px;align-items:center}
.sv.unr::after{content:"";position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:var(--red);border:3px solid var(--bg1)}
.ch.unr{color:#fff;font-weight:700}.ch.unr::after{content:"●";margin-left:auto;font-size:9px}
@media(max-width:900px){#mem{display:none}#app{grid-template-columns:72px 240px 1fr}}
.burger,#bd{display:none}
@media(max-width:700px){
html,body{height:100dvh}#app{height:100dvh;grid-template-columns:1fr}
#rail,#side{position:fixed;top:0;bottom:0;z-index:20;transform:translateX(calc(-100% - 80px));transition:transform .2s}
#rail{left:0;width:72px}#side{left:72px;width:min(240px,calc(100vw - 72px))}
#app.nav #rail,#app.nav #side{transform:none}
#app.nav #bd{display:block;position:fixed;inset:0;background:#0008;z-index:10}
.burger{display:inline-block;margin-right:8px;font-size:20px}
#inp,input.in{font-size:16px}.m .del{display:block;top:0;opacity:.7}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.t code{background:var(--bg1);padding:1px 5px;border-radius:4px;font:13px/1.4 ui-monospace,Consolas,monospace}
.t pre{background:var(--bg1);border:1px solid var(--bg2);border-radius:6px;padding:8px 10px;margin:4px 0;overflow-x:auto;white-space:pre;font:13px/1.4 ui-monospace,Consolas,monospace}
.t pre code{padding:0;background:none}.t a{color:#00a8fc;text-decoration:none}.t a:hover{text-decoration:underline}
.mn{background:rgba(88,101,242,.3);color:#c9cdfb;border-radius:3px;padding:0 2px;cursor:pointer;font-weight:500}
.m.ment{background:rgba(250,166,26,.1);box-shadow:inset 3px 0 #faa61a}
[data-theme=light]{--bg1:#e3e5e8;--bg2:#f2f3f5;--bg3:#fff;--hover:#e8e9eb;--txt:#2e3338;--mut:#5c5e66}
[data-theme=light] #me{background:#ebedef}
#acp{position:fixed;z-index:50;background:var(--bg2);border:1px solid var(--bg1);border-radius:8px;box-shadow:0 4px 16px #0006;max-height:220px;overflow:auto;display:none;min-width:180px}
#acp button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 12px;cursor:pointer}
#acp button.on,#acp button:hover{background:var(--hover)}
.qt{cursor:pointer}.m.flash{background:rgba(88,101,242,.25)}
.pl button{display:block;width:100%;max-width:360px;text-align:left;margin-top:4px;position:relative;background:var(--bg1);border:0;border-radius:4px;padding:6px 10px;cursor:pointer;overflow:hidden}
.pl .f{position:absolute;inset:0 auto 0 0;background:rgba(88,101,242,.35)}.pl span{position:relative}.pl .me{outline:1px solid var(--acc)}
#gv{position:fixed;right:12px;bottom:84px;background:var(--bg2);border:1px solid var(--bg1);border-radius:10px;padding:10px 12px;z-index:40;min-width:210px;display:none;box-shadow:0 4px 16px #0006}
#gv b{display:block;margin-bottom:6px}#gv .pp{font-size:14px;padding:2px 0}#gv .ib{margin-right:4px}
.sysm{text-align:center;color:var(--mut);font-size:13px;margin:8px 0;padding:0 12px}
</style>
</head>
<body>

<div id="auth">
  <div class="card">
    <h1 id="at">С возвращением!</h1><p id="as">Мы рады видеть вас снова</p>
    <div id="nmw" hidden><label for="aname">ИМЯ ПОЛЬЗОВАТЕЛЯ</label><input class="in" id="aname" maxlength="24" autocomplete="nickname"></div>
    <label for="aem">ЭЛЕКТРОННАЯ ПОЧТА</label><input class="in" id="aem" type="email" autocomplete="email">
    <label for="apw">ПАРОЛЬ</label><input class="in" id="apw" type="password" autocomplete="current-password">
    <div class="err" id="aerr" role="alert"></div>
    <button class="btn full" id="abtn">Вход</button>
    <button class="btn full" id="gbtn" style="background:#fff;color:#1f1f1f;margin-top:10px">Войти через Google</button>
    <p style="margin:16px 0 0;font-size:14px"><span id="aq">Нужна учётная запись?</span> <button class="link" id="asw">Зарегистрироваться</button></p>
  </div>
</div>

<div id="app">
  <nav id="rail" aria-label="Серверы"></nav>
  <aside id="side">
    <div class="hd"><span id="sname">Выберите сервер</span><button class="ib" id="menu" title="Меню сервера" hidden>⋮</button></div>
    <div id="chs"></div>
    <div id="me"><div class="av" id="meav"></div><span class="nm" id="menm"></span><button class="ib" id="cfg" title="Мой профиль">⚙</button><button class="ib" id="out" title="Выйти">⎋</button></div>
  </aside>
  <main id="main">
    <div class="hd" style="justify-content:flex-start"><button class="ib burger" id="burger" aria-label="Меню">☰</button><span id="cname" style="flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis"># —</span><button class="ib" id="vcall" title="Голосовой звонок">📞</button><button class="ib" id="vvid" title="Видеозвонок">📹</button><button class="ib" id="pins" title="Закреплённые">📌</button><button class="ib" id="srch" title="Поиск">🔍</button></div>
    <div id="msgs"><div class="empty">Создайте сервер или присоединитесь к существующему по коду приглашения.</div></div>
    <div id="ty"></div>
    <div id="rb"></div>
    <div id="form"><button class="ib" id="att" title="Фото">📎</button><button class="ib" id="vbtn" title="Видео">🎬</button><input type="file" id="vfile" accept="video/*" hidden><input id="inp" placeholder="Написать сообщение" maxlength="2000" autocomplete="off" disabled><button class="ib" id="mic" title="Голосовое сообщение">🎤</button><button class="ib" id="emo" title="Эмодзи">😀</button><input type="file" id="file" accept="image/*,video/*" hidden></div>
    <div id="emp"></div>
  </main>
  <aside id="mem"></aside>
  <div id="bd"></div>
</div>

<div class="dlg" id="dlg"><div class="card">
  <h1 id="dt"></h1><p id="dp"></p>
  <input class="in" id="di" maxlength="40"><div class="err" id="derr"></div>
  <div class="row"><button class="btn g" id="dno">Отмена</button><button class="btn" id="dyes">Готово</button></div>
</div></div>
<div class="dlg" id="lbw"><img id="lb" alt="" style="max-width:95vw;max-height:90vh;border-radius:8px"></div>
<div class="dlg" id="pnl"><div class="card" id="pc" style="max-height:88vh;overflow:auto"></div></div>
<div class="dlg" id="inc"><div class="card" id="ic" style="text-align:center"></div></div>
<div id="callui"><video id="rv" autoplay playsinline></video><video id="lv" autoplay playsinline muted></video><div id="cs"></div><div id="cbar"><button id="cmic" aria-label="Микрофон">🎤</button><button id="ccam" aria-label="Камера">📷</button><button id="cshare" aria-label="Экран">🖥</button><button id="cend" aria-label="Завершить">📞</button></div></div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, updateProfile, GoogleAuthProvider, signInWithPopup, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, addDoc, getDoc, updateDoc, deleteDoc, onSnapshot, query, where, orderBy, limit, serverTimestamp, arrayUnion, arrayRemove, setDoc, getDocs, deleteField, FieldPath, documentId, Bytes } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyBSyynf_g3goTl2bS05slOiylDnGru0m54",
  authDomain: "discord-1641a.firebaseapp.com",
  projectId: "discord-1641a",
  storageBucket: "discord-1641a.firebasestorage.app",
  messagingSenderId: "451249698925",
  appId: "1:451249698925:web:e6311a6dbbd59957f9a764"
});
const auth = getAuth(app);
let db; try { db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true, localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); } catch { db = getFirestore(app); }
setPersistence(auth, browserLocalPersistence).catch(() => {}); // вход сохраняется после закрытия браузера
const $ = id => document.getElementById(id);
const LS = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const applyLook = () => { document.documentElement.dataset.theme = LS.get("theme") || "dark"; document.body.style.fontSize = (LS.get("fs") || "15") + "px"; };
applyLook();
queueMicrotask(() => { $("burger").onclick = () => $("app").classList.toggle("nav"); $("bd").onclick = () => $("app").classList.remove("nav"); });
const h = (tag, props = {}, ...kids) => { const e = document.createElement(tag); Object.assign(e, props); kids.forEach(k => e.append(k)); return e; };
const ucache = {};
const colors = ["#5865f2","#eb459e","#f0b232","#23a55a","#00a8fc","#ed4245","#9b59b6"];
const colorOf = s => colors[[...String(s)].reduce((a, c) => a + c.charCodeAt(0), 0) % colors.length];
const avatar = (name, uid) => { const u = uid ? getUser(uid) : {}; const a = h("div", { className: "av", textContent: (u.name || name || "?")[0].toUpperCase() }); if (u.avatar) { a.style.backgroundImage = `url("${u.avatar}")`; a.style.backgroundSize = "cover"; a.style.backgroundPosition = "center"; a.classList.add("img"); } else a.style.background = colorOf(name); return a; };
const toast = t => { const e = $("toast"); e.textContent = t; e.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = "none", 2200); };

let user = null, servers = [], cur = null, curCh = null, chans = [], home = false, friends = [], mpath = null, allChans = [], curList = [];
let unsub = { sv: null, ch: null, msg: null };

/* ---------- AUTH ---------- */
let reg = false;
const authErrs = { "auth/invalid-credential": "Неверная почта или пароль", "auth/invalid-email": "Некорректная почта", "auth/email-already-in-use": "Эта почта уже зарегистрирована", "auth/weak-password": "Пароль минимум 6 символов", "auth/too-many-requests": "Слишком много попыток, подождите", "auth/network-request-failed": "Нет соединения с сетью", "auth/operation-not-allowed": "Этот способ входа не включён в Firebase Authentication", "auth/unauthorized-domain": "Добавьте домен сайта в Authentication → Settings → Authorized domains", "auth/popup-blocked": "Браузер заблокировал окно входа, разрешите всплывающие окна" };
function setMode(r) {
  reg = r; $("nmw").hidden = !r; $("aerr").textContent = "";
  $("at").textContent = r ? "Создать учётную запись" : "С возвращением!";
  $("as").textContent = r ? "Присоединяйтесь к нам" : "Мы рады видеть вас снова";
  $("abtn").textContent = r ? "Продолжить" : "Вход";
  $("aq").textContent = r ? "Уже есть аккаунт?" : "Нужна учётная запись?";
  $("asw").textContent = r ? "Войти" : "Зарегистрироваться";
}
$("asw").onclick = () => setMode(!reg);
async function submitAuth() {
  const em = $("aem").value.trim(), pw = $("apw").value, nm = $("aname").value.trim();
  if (!em || !pw || (reg && !nm)) { $("aerr").textContent = "Заполните все поля"; return; }
  $("abtn").disabled = true;
  try {
    if (reg) { const c = await createUserWithEmailAndPassword(auth, em, pw); await updateProfile(c.user, { displayName: nm }); user = auth.currentUser; boot(); }
    else await signInWithEmailAndPassword(auth, em, pw);
  } catch (e) { $("aerr").textContent = authErrs[e.code] || e.message; }
  $("abtn").disabled = false;
}
$("abtn").onclick = submitAuth;
["aem", "apw", "aname"].forEach(i => $(i).addEventListener("keydown", e => e.key === "Enter" && submitAuth()));
$("gbtn").onclick = async () => {
  $("aerr").textContent = "";
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) { if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") $("aerr").textContent = authErrs[e.code] || e.message; }
};
$("out").onclick = () => signOut(auth);
onAuthStateChanged(auth, u => {
  user = u;
  if (u) { $("auth").style.display = "none"; $("app").style.display = "grid"; boot(); }
  else { Object.values(unsub).forEach(f => f && f()); unsub = {}; servers = []; friends = []; home = false; mpath = null; cur = curCh = null; $("auth").style.display = "grid"; $("app").style.display = "none"; }
});
const myName = () => user.displayName || user.email.split("@")[0];

/* ---------- SERVERS ---------- */
function boot() {
  if (!user) return;
  delete ucache[user.uid]; paintMe(); listenIncoming();
  setDoc(doc(db, "users", user.uid), { name: myName(), nameLower: myName().toLowerCase() }, { merge: true }).catch(() => {});
  unsub.fr && unsub.fr();
  unsub.fr = onSnapshot(query(collection(db, "friends"), where("users", "array-contains", user.uid)), snap => { friends = snap.docs.map(d => ({ id: d.id, ...d.data() })); renderRail(); if (home) renderHome(); paintTyping(); }, e => toast("Друзья: " + e.code));
  unsub.sv && unsub.sv();
  unsub.sv = onSnapshot(query(collection(db, "servers"), where("members", "array-contains", user.uid)), snap => {

/* ---------- ГРУППОВОЙ ГОЛОС (mesh WebRTC через Firestore) ---------- */
let vc = null, vw = null;
const gv = h("div", { id: "gv" }); document.body.append(gv);
const vlive = d => Date.now() - (d.hb || d.t || 0) < 90000;
const vsig = (to, type, data) => addDoc(collection(db, "servers", vc.sid, "voice", to, "sig"), { from: user.uid, type, data: JSON.stringify(data) }).catch(() => {});
function vclose(uid) { const p = vc?.peers[uid]; if (!p) return; p.pc.close(); if (p.el) p.el.srcObject = null; delete vc.peers[uid]; }
function vpeer(uid) {
  vclose(uid); const pc = new RTCPeerConnection(ICE), p = { pc, buf: [], el: null }; vc.peers[uid] = p;
  vc.stream.getTracks().forEach(t => pc.addTrack(t, vc.stream));
  pc.onicecandidate = e => e.candidate && vsig(uid, "ice", e.candidate.toJSON());
  pc.ontrack = e => { if (!p.el) { p.el = new Audio(); p.el.autoplay = true; } p.el.srcObject = e.streams[0]; p.el.play?.().catch(() => {}); };

}
const vflush = async p => { for (const c of p.buf.splice(0)) await p.pc.addIceCandidate(c).catch(() => {}); };
function vrender() {
  if (!vc) return; const mic = h("button", { className: "ib", textContent: vc.stream.getAudioTracks()[0]?.enabled ? "🎤" : "🔇", title: "Микрофон" }), out = h("button", { className: "ib", textContent: "📵", title: "Выйти из голосового канала" });
  mic.onclick = () => { const t = vc.stream.getAudioTracks()[0]; t.enabled = !t.enabled; vrender(); }; out.onclick = leaveVoice;
  gv.replaceChildren(h("b", { textContent: "🔊 Голосовой канал" }), ...vc.parts.map(d => h("div", { className: "pp", textContent: "● " + (d.name || "?") + (d.id === user.uid ? " (вы)" : "") })), h("div", { style: "margin-top:6px" }, mic, out)); gv.style.display = "block";
}
async function joinVoice(sid) {
  if (vc) return toast("Вы уже в голосовом канале"); if (pc) return toast("Сначала завершите личный звонок");
  let stream; try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); } catch (e) { return toast("Нет доступа к микрофону: " + mediaErr(e)); }

  try {
    await setDoc(mine, { name: myName(), t, hb: t });
    const old = await getDocs(collection(db, "servers", sid, "voice", user.uid, "sig")); old.docs.forEach(d => deleteDoc(d.ref).catch(() => {}));
    const others = (await getDocs(collection(db, "servers", sid, "voice"))).docs.filter(d => d.id !== user.uid && vlive(d.data()));
    if (!others.length && mpath?.[0] === "servers" && mpath[1] === sid) {
      vc.msg = await addDoc(collection(db, ...mpath), { text: "🔊 " + myName() + " начал(а) голосовой звонок", sys: true, uid: user.uid, name: myName(), createdAt: serverTimestamp() });
      updateDoc(doc(db, "servers", sid, "channels", mpath[3]), { last: serverTimestamp(), lastBy: user.uid }).catch(() => {});
    }
  } catch (e) { stream.getTracks().forEach(x => x.stop()); vc = null; return toast("Ошибка: " + e.code); }
  vc.hb = setInterval(() => updateDoc(mine, { hb: Date.now() }).catch(() => {}), 25000);
  vc.unsubs.push(onSnapshot(collection(db, "servers", sid, "voice"), snap => {
    if (!vc) return; const live = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(vlive); vc.parts = live; vrender();
    const ids = new Set(live.map(x => x.id)); Object.keys(vc.peers).forEach(u => !ids.has(u) && vclose(u));
    live.forEach(async d => {
      if (d.id === user.uid || vc?.peers[d.id]) return;
      if (d.t < t || (d.t === t && d.id < user.uid)) { const p = vpeer(d.id); try { const o = await p.pc.createOffer(); await p.pc.setLocalDescription(o); vsig(d.id, "offer", { type: o.type, sdp: o.sdp }); } catch {} }
    });
  }, e => toast("Голос: " + e.code)));
  vc.unsubs.push(onSnapshot(collection(db, "servers", sid, "voice", user.uid, "sig"), snap => snap.docChanges().forEach(async ch => {
    if (ch.type !== "added") return; const d = ch.doc.data(); deleteDoc(ch.doc.ref).catch(() => {}); if (!vc) return;
    try {
      const data = JSON.parse(d.data);
      if (d.type === "offer") { const p = vpeer(d.from); await p.pc.setRemoteDescription(data); await vflush(p); const a = await p.pc.createAnswer(); await p.pc.setLocalDescription(a); vsig(d.from, "answer", { type: a.type, sdp: a.sdp }); }

    } catch {}
  })));

}
function leaveVoice() {

}
addEventListener("pagehide", leaveVoice);
const vban = h("div", { id: "vban", style: "display:none;align-items:center;gap:10px;padding:8px 12px;background:rgba(35,165,90,.18);border-bottom:1px solid var(--bg1)" }); $("msgs").before(vban);

setInterval(vbanUpdate, 3000);
{ const vg = h("button", { className: "ib", id: "vgrp", title: "Голосовой канал сервера (для всех)", textContent: "🔊" }); $("vvid").after(vg);
  vg.onclick = () => vc ? toast("Вы уже в голосовом канале") : mpath?.[0] === "servers" ? joinVoice(mpath[1]) : toast("Откройте канал сервера"); }
